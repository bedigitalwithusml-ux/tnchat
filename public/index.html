<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Direct • Our Space ❤️</title>
  <meta name="description" content="Private Instagram Direct style messaging for two.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- LOGIN / SELECT ACCOUNT SCREEN -->
  <div id="loginScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-header">
        <div class="ig-logo-badge">❤️</div>
        <h1>Our Space</h1>
        <p class="auth-subtitle">Private Direct Messages</p>
      </div>

      <div id="authError" class="auth-error hidden"></div>

      <div class="quick-login-grid">
        <button type="button" class="quick-user-card" data-username="tishu1221">
          <div class="avatar-ring">
            <div class="avatar-inner">❤️</div>
          </div>
          <span class="user-card-name">Tishu</span>
          <span class="user-card-handle">@tishu1221</span>
        </button>

        <button type="button" class="quick-user-card" data-username="bugu1221">
          <div class="avatar-ring">
            <div class="avatar-inner">🥰</div>
          </div>
          <span class="user-card-name">Bugu</span>
          <span class="user-card-handle">@bugu1221</span>
        </button>
      </div>

      <form id="loginForm" class="auth-form hidden">
        <div class="input-group">
          <input type="text" id="usernameInput" placeholder="tishu1221 or bugu1221" autocomplete="username">
        </div>
        <button type="submit" id="loginBtn" class="btn-primary">
          <span>Log In</span>
        </button>
      </form>

      <div class="auth-footer">
        <button type="button" id="toggleManualLoginBtn" class="link-btn">Manual Entry</button>
      </div>
    </div>
  </div>

  <!-- MAIN IG DIRECT CHAT APP -->
  <div id="appScreen" class="app-screen hidden">

    <!-- MAIN CHAT CONTAINER -->
    <main class="chat-container">

      <!-- IG HEADER -->
      <header class="chat-header">
        <div class="header-user-info" id="headerUserInfo">
          <div class="avatar-story-ring">
            <div class="avatar-img" id="partnerAvatar">❤️</div>
            <span class="status-dot offline" id="partnerStatusDot"></span>
          </div>
          <div class="user-text">
            <h2 id="partnerName">Soulmate</h2>
            <span class="status-text" id="partnerStatusText">Offline</span>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="themeToggleBtn" title="Toggle Light / Dark Mode" aria-label="Toggle Theme">
            🌙
          </button>

          <button class="icon-btn" id="searchToggleBtn" title="Search Messages" aria-label="Search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
          
          <button class="icon-btn" id="pinnedToggleBtn" title="Pinned Messages" aria-label="Pinned">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a1 1 0 0 0 0-2H8a1 1 0 0 0 0 2h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
          </button>

          <button class="icon-btn" id="switchUserBtn" title="Switch Account" aria-label="Switch User">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"></path></svg>
          </button>
        </div>
      </header>

      <!-- MESSAGES STREAM CONTAINER -->
      <div id="messagesContainer" class="messages-container">
        
        <!-- EMPTY STATE -->
        <div id="emptyState" class="empty-state hidden">
          <div class="empty-avatar-ring">
            <div class="empty-avatar-inner" id="emptyPartnerAvatar">❤️</div>
          </div>
          <h3 id="emptyPartnerTitle">Soulmate</h3>
          <p>Instagram Direct • Private 2-Person Space</p>
          <button class="btn-secondary say-hi-btn" id="sendFirstMsgBtn">Say Hi 👋</button>
        </div>

        <!-- MESSAGES STREAM -->
        <div id="messageStream" class="message-stream"></div>

        <!-- TYPING INDICATOR BANNER -->
        <div id="typingIndicator" class="typing-banner hidden">
          <div class="dots-pulse">
            <span></span><span></span><span></span>
          </div>
          <span id="typingText">typing...</span>
        </div>
      </div>

      <!-- REPLY PREVIEW BAR -->
      <div id="replyBar" class="reply-bar hidden">
        <div class="reply-content">
          <span class="reply-label" id="replyLabel">Replying to message</span>
          <p class="reply-text" id="replySnippet">Message content...</p>
        </div>
        <button class="icon-btn close-reply" id="cancelReplyBtn" title="Cancel Reply">✕</button>
      </div>

      <!-- EDIT PREVIEW BAR -->
      <div id="editBar" class="edit-bar hidden">
        <div class="edit-content">
          <span class="edit-label">Editing Message</span>
          <p class="edit-text" id="editSnippet"></p>
        </div>
        <button class="icon-btn close-edit" id="cancelEditBtn" title="Cancel Edit">✕</button>
      </div>

      <!-- PENDING ATTACHMENT PREVIEW -->
      <div id="attachmentPreviewBar" class="attachment-preview-bar hidden">
        <div id="attachmentThumbnails" class="attachment-thumbnails"></div>
        <button class="icon-btn close-attachment" id="cancelAttachmentBtn">✕</button>
      </div>

      <!-- IG COMPOSER -->
      <footer class="chat-composer">
        <input type="file" id="fileInput" class="hidden" multiple accept="image/*,video/*,.pdf,.txt,.doc,.docx">
        
        <button class="icon-btn composer-icon-btn" id="attachBtn" title="Take photo or choose from gallery" aria-label="Photo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
        </button>

        <div class="textarea-wrapper">
          <textarea id="messageInput" placeholder="Message..." rows="1" maxlength="4000"></textarea>
        </div>

        <button id="sendHeartBtn" class="icon-btn heart-quick-btn" title="Send Heart" aria-label="Send Heart">
          ❤️
        </button>

        <button id="sendMsgBtn" class="send-btn hidden" title="Send" aria-label="Send">
          Send
        </button>
      </footer>
    </main>

    <!-- SEARCH DRAWER -->
    <div id="searchDrawer" class="drawer hidden">
      <div class="drawer-header">
        <h3>Search Conversation</h3>
        <button class="icon-btn" id="closeSearchBtn">✕</button>
      </div>
      <div class="drawer-body">
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="Search message text...">
        </div>
        <div id="searchResults" class="search-results-list"></div>
      </div>
    </div>

    <!-- PINNED MESSAGES DRAWER -->
    <div id="pinnedDrawer" class="drawer hidden">
      <div class="drawer-header">
        <h3>📌 Pinned Messages</h3>
        <button class="icon-btn" id="closePinnedBtn">✕</button>
      </div>
      <div class="drawer-body">
        <div id="pinnedList" class="pinned-list"></div>
      </div>
    </div>

    <!-- MEMORIES DRAWER -->
    <div id="memoriesDrawer" class="drawer hidden">
      <div class="drawer-header">
        <h3>Our Memories ❤️</h3>
        <button class="icon-btn" id="closeMemoriesBtn">✕</button>
      </div>
      <div class="drawer-body">
        <div class="add-memory-card">
          <h4>Add a Memory</h4>
          <input type="text" id="memoryTitleInput" placeholder="Memory Title">
          <textarea id="memoryDescInput" placeholder="Memory description..." rows="2"></textarea>
          <button class="btn-primary" id="saveMemoryBtn" style="border-radius:12px;">Save Memory</button>
        </div>
        <div id="memoriesGrid" class="memories-grid"></div>
      </div>
    </div>

    <!-- LIGHTBOX MODAL -->
    <div id="lightboxModal" class="lightbox-overlay hidden">
      <button class="lightbox-close" id="closeLightboxBtn">✕</button>
      <div class="lightbox-content">
        <img id="lightboxImg" src="" alt="Full view">
        <div class="lightbox-actions">
          <a id="lightboxDownloadBtn" download href="#" class="btn-secondary">Download Photo</a>
        </div>
      </div>
    </div>

  </div>

  <script src="/js/app.js"></script>
</body>
</html>
